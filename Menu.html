    }
    
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fade-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    
    .animate-delay-1 { animation-delay: 0.1s; }
    .animate-delay-2 { animation-delay: 0.2s; }
    .animate-delay-3 { animation-delay: 0.3s; }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }

function getUserId() {

    // Default configuration

      welcome_text: 'ยินดีต้อนรับ',
      password_title: 'กรุณาใส่รหัสเพื่อเข้าใช้งาน',
      password_placeholder: 'ใส่รหัสผ่าน',
      submit_button: 'ยืนยัน',

      secondary_action_color: '#f97316',
      font_family: 'Prompt',
      font_size: 16
    };
    
async function verifyMenuPin(menuCode, inputPin) {
  const userId = getUserId();
  if (!userId) return false;

  const { data, error } = await supabaseClient
    .from('UserMenuPIN')
    .select('pin_hash')
    .eq('user_id', userId)
    .eq('menu_code', menuCode)
    .eq('is_active', true)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (error || !data) {
    console.error('PIN error:', error);
    return false;
  }

  // ✅ ต้อง return ค่า
  return window.dcodeIO.bcrypt.compareSync(inputPin, data.pin_hash);
}


    // Show toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }

    // Show/Hide password modal
    function showPasswordModal() {
      const modal = document.getElementById('password-modal');
      const modalContent = document.getElementById('password-modal-content');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      setTimeout(() => {
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
      }, 10);
      document.getElementById('password-input').focus();
    }

    function hidePasswordModal() {
      const modal = document.getElementById('password-modal');
      const modalContent = document.getElementById('password-modal-content');
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('pointer-events-none', 'opacity-0');
        modal.classList.remove('opacity-100');
      }, 200);
      document.getElementById('password-input').value = '';
      document.getElementById('error-message').classList.add('hidden');
    }

}

    // Map to capabilities
    function mapToCapabilities(config) {
      const cfg = window.elementSdk?.config || config || defaultConfig;
      
      return {
        recolorables: [
          {
            get: () => cfg.background_color || defaultConfig.background_color,
            set: (value) => { cfg.background_color = value; window.elementSdk?.setConfig({ background_color: value }); }
          },
          {
            get: () => cfg.card_color || defaultConfig.card_color,
            set: (value) => { cfg.card_color = value; window.elementSdk?.setConfig({ card_color: value }); }
          },
          {
            get: () => cfg.text_color || defaultConfig.text_color,
            set: (value) => { cfg.text_color = value; window.elementSdk?.setConfig({ text_color: value }); }
          },
          {
            get: () => cfg.primary_action_color || defaultConfig.primary_action_color,
            set: (value) => { cfg.primary_action_color = value; window.elementSdk?.setConfig({ primary_action_color: value }); }
          },
          {
            get: () => cfg.secondary_action_color || defaultConfig.secondary_action_color,

      ]);
