<!DOCTYPE html>
<html class="light" lang="th">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>DataNest - เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .content-thai {
      font-family: 'IBM Plex Sans Thai', sans-serif;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.45s ease-out both;
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "tertiary-fixed": "#c9e6ff",
            "surface-container-low": "#f2f4f6",
            "secondary-fixed": "#d3e4fe",
            "on-tertiary": "#ffffff",
            "outline-variant": "#c3c6d7",
            "on-primary-fixed": "#00174b",
            "on-secondary": "#ffffff",
            "background": "#f7f9fb",
            "on-tertiary-fixed-variant": "#004c6e",
            "on-primary-container": "#eeefff",
            "surface-dim": "#d8dadc",
            "on-error-container": "#93000a",
            "secondary-container": "#d0e1fb",
            "surface": "#f7f9fb",
            "on-tertiary-fixed": "#001e2f",
            "on-secondary-container": "#54647a",
            "tertiary-fixed-dim": "#89ceff",
            "error-container": "#ffdad6",
            "primary-fixed-dim": "#b4c5ff",
            "primary-container": "#2563eb",
            "tertiary": "#005a82",
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
            "tertiary-container": "#0074a6",
            "surface-bright": "#f7f9fb",
            "surface-container-high": "#e6e8ea",
            "on-secondary-fixed": "#0b1c30",
            "on-surface-variant": "#434655",
            "primary": "#004ac6",
            "inverse-surface": "#2d3133",
            "surface-variant": "#e0e3e5",
            "surface-container": "#eceef0",
            "on-error": "#ffffff",
            "surface-tint": "#0053db",
            "primary-fixed": "#dbe1ff",
            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#003ea8",
            "secondary-fixed-dim": "#b7c8e1",
            "on-background": "#191c1e",
            "secondary": "#505f76",
            "outline": "#737686",
            "on-tertiary-container": "#e4f2ff",
            "on-surface": "#191c1e",
            "on-secondary-fixed-variant": "#38485d",
            "inverse-on-surface": "#eff1f3",
            "surface-container-highest": "#e0e3e5",
            "inverse-primary": "#b4c5ff"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            lg: "24px",
            md: "16px",
            "base-unit": "4px",
            gutter: "20px",
            xs: "4px",
            xl: "48px",
            sm: "8px",
            "container-margin": "32px"
          },
          fontFamily: {
            "body-base": ["Inter"],
            "label-uppercase": ["Inter"],
            "headline-md": ["Manrope"],
            "display-lg": ["Manrope"],
            "body-sm": ["Inter"]
          },
          fontSize: {
            "body-base": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
            "label-uppercase": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
            "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "0em", fontWeight: "600" }],
            "display-lg": ["36px", { lineHeight: "44px", letterSpacing: "0em", fontWeight: "700" }],
            "body-sm": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background min-h-screen flex flex-col selection:bg-primary-fixed-dim">
  <header class="bg-slate-50/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-slate-200/60 shadow-sm font-['Manrope'] antialiased">
    <div class="flex items-center justify-between px-6 py-3 max-w-full">
      <div class="flex items-center gap-8">
        <span class="text-xl font-bold tracking-tight text-slate-900">DataNest</span>
      </div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-32 relative overflow-hidden">
    <div class="w-full max-w-[480px] z-10 space-y-8 animate-fade-in">
      <div class="text-center space-y-2 content-thai">
        <h1 class="text-[40px] font-bold tracking-tight text-on-surface leading-tight">ยินดีต้อนรับ</h1>
        <p class="text-on-surface-variant font-light text-lg">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
      </div>

      <div class="bg-surface-container-lowest rounded-[24px] p-10 border border-outline-variant/30 shadow-[0px_4px_20px_rgba(0,0,0,0.04),0px_20px_40px_rgba(0,0,0,0.02)]">
        <form class="space-y-6 content-thai" onsubmit="handleLogin(event)">
          <div class="space-y-2">
            <label class="text-sm font-medium text-on-surface-variant ml-1" for="username">User ID</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
                <span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
              </div>
              <input class="w-full pl-12 pr-4 py-4 bg-background border border-outline-variant/50 rounded-[12px] text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all duration-300 placeholder:text-outline/60" id="username" placeholder="ป้อนรหัสผู้ใช้งานของคุณ" type="text" required/>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
              <label class="text-sm font-medium text-on-surface-variant" for="password">Password</label>
            </div>
            <div class="relative group">
              <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
                <span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
              </div>
              <input class="w-full pl-12 pr-12 py-4 bg-background border border-outline-variant/50 rounded-[12px] text-body-base focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all duration-300 placeholder:text-outline/60" id="password" placeholder="ป้อนรหัสผ่านของคุณ" type="password" required/>
              <button id="togglePassword" class="absolute inset-y-0 right-4 flex items-center text-outline hover:text-on-surface transition-colors" type="button" aria-label="แสดงหรือซ่อนรหัสผ่าน">
                <span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
              </button>
            </div>
          </div>
          <button id="loginBtn" class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-semibold rounded-[12px] shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 group disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:translate-y-0" type="submit">
            <span class="text-lg">เข้าสู่ระบบ</span>
            <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
          </button>

          <p id="error" class="min-h-[20px] text-error text-sm text-center"></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-slate-50 border-t border-slate-100 font-['Manrope']">
    <div class="flex flex-col md:flex-row justify-between items-center px-8 py-12 gap-4 max-w-7xl mx-auto">
      <div class="flex flex-col gap-2 text-center md:text-left">
        <span class="font-bold text-slate-900">DataNest</span>
        <p class="text-sm text-slate-500">© 2024 DataNest Logic. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePassword.querySelector("span").textContent = isHidden ? "visibility_off" : "visibility";
    });

    window.handleLogin = async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();
      const button = document.getElementById("loginBtn");
      const buttonText = button.querySelector("span");
      const errorEl = document.getElementById("error");

      button.disabled = true;
      buttonText.textContent = "กำลังเข้าสู่ระบบ...";
      errorEl.textContent = "";

      const { data, error } = await supabase.rpc("verify_user_login", {
        p_user_id: username,
        p_password: password,
      });

      const user = Array.isArray(data) ? data[0] : null;

      if (error || !user) {
        errorEl.textContent = "User ID หรือรหัสผ่านไม่ถูกต้อง";
        button.disabled = false;
        buttonText.textContent = "เข้าสู่ระบบ";
        return;
      }

      if (!user.session_token) {
        errorEl.textContent = "ไม่สามารถสร้าง session สำหรับเข้าสู่ระบบได้";
        button.disabled = false;
        buttonText.textContent = "เข้าสู่ระบบ";
        return;
      }

      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem("name", user.name || user.full_name || user.employee_name || "");
      localStorage.setItem("nickname", user.nickname || "");
      localStorage.setItem("department", user.department || "");
      localStorage.setItem("userId", user.user_id);
      sessionStorage.setItem("alive", "true");
      sessionStorage.setItem("appSessionToken", user.session_token);
      sessionStorage.setItem("appSessionExpiresAt", user.expires_at || "");
      sessionStorage.setItem("appSessionMaxExpiresAt", user.max_expires_at || "");
      sessionStorage.setItem("appLastActivityAt", String(Date.now()));
      localStorage.setItem("alive", "true");
      window.location.href = "Menu.html";
    };
  </script>
</body>
</html>
