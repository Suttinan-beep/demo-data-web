<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    body { font-family: 'Kanit', sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #fff3e0 100%); min-height: 100vh; }
    .frosted-glass { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); }
    .gradient-button { background: linear-gradient(135deg, #42a5f5 0%, #ff8a65 100%); transition: all 0.3s ease; }
    .gradient-button:hover { background: linear-gradient(135deg, #1e88e5 0%, #ff7043 100%); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
    .input-field { transition: all 0.3s ease; }
    .input-field:focus { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(66, 165, 245, 0.15); }
    .floating-shapes { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
    .shape { position: absolute; background: rgba(255, 255, 255, 0.1); border-radius: 50%; animation: float 6s ease-in-out infinite; }
    .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }
    @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(180deg); } }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <!-- Floating Background Shapes -->
  <div class="floating-shapes">
    <div class="shape"></div><div class="shape"></div><div class="shape"></div>
  </div>

  <!-- Login Container -->
  <div class="frosted-glass rounded-3xl shadow-2xl p-8 w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-orange-300 rounded-full mx-auto mb-4 flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-gray-800 mb-2">ยินดีต้อนรับ</h1>
      <p class="text-gray-600 text-sm">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
    </div>

    <!-- Login Form -->
    <form class="space-y-6" onsubmit="handleLogin(event)">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <input type="text" id="username" class="input-field w-full pl-12 pr-4 py-4 bg-white/50 border border-white/30 rounded-2xl focus:outline-none focus:border-blue-400 text-gray-800 placeholder-gray-500" placeholder="User ID" required>
      </div>

      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <input type="password" id="password" class="input-field w-full pl-12 pr-4 py-4 bg-white/50 border border-white/30 rounded-2xl focus:outline-none focus:border-blue-400 text-gray-800 placeholder-gray-500" placeholder="รหัสผ่าน" required>
      </div>

      <button type="submit" id="loginBtn" class="gradient-button w-full py-4 rounded-2xl text-white font-semibold text-lg shadow-lg flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
        </svg>
        <span>เข้าสู่ระบบ</span>
      </button>
      <p id="error" class="text-red-500 text-center"></p>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://ihfxsyxzjgolhfumemiw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZnhzeXh6amdvbGhmdW1lbWl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3MDEwNDksImV4cCI6MjA3MTI3NzA0OX0.dPtOjlr6N3WEclJ2rcQ0HkWtGDLgn-qdQlKGa4DCe9o";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const button = document.getElementById("loginBtn");
      const errorEl = document.getElementById("error");

      // Loading state
      button.disabled = true;
      button.innerHTML = `<svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg> กำลังเข้าสู่ระบบ...`;

      // ตรวจสอบกับ Supabase
      const { data, error } = await supabase
        .from("UserIDdemoDATA")
        .select("User_ID, Password, NicKname")
        .eq("User_ID", parseInt(username))
        .single();

      if (error || !data) {
        errorEl.textContent = "❌ ไม่พบ User นี้";
        button.disabled = false;
        button.innerHTML = `<span>เข้าสู่ระบบ</span>`;
        return;
      }

      if (data.Password === password) {
        localStorage.setItem("nickname", data.NicKname);
        localStorage.setItem("userId", data.User_ID);
        window.location.href = "Index.html";
      } else {
        errorEl.textContent = "❌ รหัสผ่านไม่ถูกต้อง";
        button.disabled = false;
        button.innerHTML = `<span>เข้าสู่ระบบ</span>`;
      }
    }
  </script>
</body>
</html>
