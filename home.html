<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบค้นหาข้อมูลลูกค้า</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.addEventListener("beforeunload", () => {
  sessionStorage.removeItem("alive");
});
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bright-blue': '#0EA5E9',
            'bright-orange': '#FB923C',
            'light-blue': '#E0F2FE',
            'light-orange': '#FED7AA'
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0EA5E9 0%, #FB923C 100%); }
    .table-scroll { max-height: 500px; overflow-y: auto; }
    .table-scroll::-webkit-scrollbar { width: 8px; }
    .table-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .table-scroll::-webkit-scrollbar-thumb { background: #0EA5E9; border-radius: 4px; }
    .table-scroll::-webkit-scrollbar-thumb:hover { background: #0284C7; }

/* numberOfInstallations ~ 5 ซม. */
    table th:nth-child(5),
    table td:nth-child(5) {
      min-width: 190px;   /* ~5 ซม. */
      max-width: 190px;
      text-align: center;
}
/* canter  */
    table td:nth-child(6),
    table td:nth-child(6),
    table td:nth-child(10),
    table td:nth-child(10),
    table td:nth-child(11),
    table td:nth-child(11),
    table td:nth-child(16),
    table td:nth-child(16),
    table td:nth-child(21),
    table td:nth-child(21)
    {
      text-align: center;
}
/* technicians & zone = Auto Fit */
    table th:nth-child(4),
    table td:nth-child(4),
    table th:nth-child(7),
    table td:nth-child(7),
    table th:nth-child(9),
    table td:nth-child(9),
    table th:nth-child(20),
    table th:nth-child(20),
    table th:nth-child(22),
    table td:nth-child(22),
    table th:nth-child(23),
    table td:nth-child(23),
    table td:nth-child(24),
    table td:nth-child(24) {
      white-space: nowrap;   /* ไม่ตัดบรรทัด */
      width: auto;
}
  </style>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gradient-to-br from-light-blue to-light-orange min-h-screen">

<div class="container mx-auto px-4 py-8">

  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-4xl font-bold gradient-bg bg-clip-text text-transparent mb-2">DATABASE</h1>
    <p id="userInfo" class="text-gray-700 text-sm mt-2"></p>
  </div>
  <!-- Search Form (UNCHANGED UI) -->
  <div class="bg-white rounded-2xl shadow-xl p-8 mb-8 border border-bright-blue/20">
    <h3 class="text-xl font-semibold text-gray-800 mb-6 flex items-center">
      🔍 ค้นหาข้อมูลลูกค้า
      <span class="text-sm font-normal text-gray-500 ml-2">(สามารถค้นหาได้หลายเงื่อนไขพร้อมกัน)</span>
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">📋 ลำดับสัญญา</label>
        <input id="contractNumber" class="w-full px-4 py-3 border-2 border-bright-blue/30 rounded-xl" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">🏠 House Number</label>
        <input id="houseNumber" class="w-full px-4 py-3 border-2 border-bright-orange/30 rounded-xl" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">⚡ Circuit Number</label>
        <input id="circuitNumber" class="w-full px-4 py-3 border-2 border-bright-blue/30 rounded-xl" />
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button onclick="searchContract()" class="gradient-bg text-white px-8 py-3 rounded-xl font-semibold">🔎 ค้นหาข้อมูล</button>
      <button onclick="clearSearch()" class="bg-gray-100 text-gray-700 px-8 py-3 rounded-xl font-semibold">🗑️ ล้างข้อมูล</button>
    </div>
  </div>

  <!-- Results Section (UNCHANGED UI) -->
  <div id="resultsSection" class="bg-white rounded-2xl shadow-xl border border-bright-orange/20 hidden">
    <div class="gradient-bg text-white p-6 rounded-t-2xl flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-bold">📊 ผลการค้นหา</h2>
        <p id="resultCount" class="text-white/90 mt-1"></p>
      </div>
      <button onclick="downloadExcel()" class="bg-white/20 hover:bg-white/30 text-white px-6 py-3 rounded-xl font-semibold">📥 ดาวน์โหลด Excel</button>
    </div>

    <div class="p-6">
      <div class="table-scroll border border-gray-200 rounded-xl">
        <table class="w-full text-sm">
          <thead class="bg-gradient-to-r from-bright-blue to-bright-orange text-white sticky top-0">
            <tr id="tableHead"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="noResults" class="bg-white rounded-2xl shadow-xl p-8 text-center hidden">
    <div class="text-6xl mb-4">🔍</div>
    <h3 class="text-xl font-semibold text-gray-700 mb-2">ไม่พบข้อมูลที่ค้นหา</h3>
    <p class="text-gray-500">กรุณาตรวจสอบข้อมูลและลองค้นหาใหม่อีกครั้ง</p>
  </div>
</div>
<script>
/******** CONFIG ********/
const SUPABASE_URL = "https://ihfxsyxzjgolhfumemiw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZnhzeXh6amdvbGhmdW1lbWl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3MDEwNDksImV4cCI6MjA3MTI3NzA0OX0.dPtOjlr6N3WEclJ2rcQ0HkWtGDLgn-qdQlKGa4DCe9o";
const supabaseClient = supabase.createClient(
      SUPABASE_URL,SUPABASE_ANON_KEY,
  {
    global: {
      headers: {
        'x-user-id': getUserId()
      }
    }
  }
);

/******** 🔐 CHECK LOGIN (LOCAL STORAGE VERSION) ********/
const uid = localStorage.getItem("userId");
const alive = sessionStorage.getItem("alive");

if (!uid || !alive) {
  localStorage.clear();
  window.location.href = "Index.html";
}

const FIELDS = [
  'year','month','key','numberOfInstallations','contractNumber','buildingName','bldg_id',
  'operatorBuildingName','building','floor','houseNumber','circuitNumber','startDate','endDate',
  'customerStatus','operator','projectType','plugStatus','dataStatus','cancelReward','technicians','zone','note'
];

const $ = id => document.getElementById(id);
let currentResults = [];
let lastSearchOrders = null; // ⭐ เพิ่ม

/******** INIT ********/
$('tableHead').innerHTML = ['No.', ...FIELDS].map(h => `<th class="px-4 py-3 text-left font-semibold">${h}</th>`).join('');

/******** HELPERS ********/
function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function fileDateStr() {   // ⭐ เพิ่มอันนี้
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}


function getUserId() {
  return ['currentUserID','currentUserId','userId','userid']
    .map(k=>localStorage.getItem(k))
    .find(Boolean);
}
function getNickname() {
  return ['currentNickname','nickname','NickName','nick','Nick']
    .map(k => localStorage.getItem(k))
    .find(Boolean);
}
window.addEventListener('DOMContentLoaded', () => {
  const uid = getUserId();
  const nick = getNickname();
  if (uid) {
    $('userInfo').textContent =
      `👤 ${nick || 'ผู้ใช้'} (User ID: ${uid})`;
  }
});

async function logStory(type, orders) {
  const payload = {
    created_at: nowStr(),
    User_ID_FK: getUserId(),
    Story: type,
    Orders: orders
  };

  const { data, error } = await supabaseClient
    .from('Storyline')
    .insert([payload]);

  console.log('Story payload:', payload);
  console.log('Story data:', data);
  console.log('Story error:', error);
}


/******** CORE ********/
async function searchContract() {
  const orders = {
    contractNumber: $('contractNumber').value.trim() || null,
    houseNumber: $('houseNumber').value.trim() || null,
    circuitNumber: $('circuitNumber').value.trim() || null
  };

  if (!orders.contractNumber && !orders.houseNumber && !orders.circuitNumber) {
    alert('กรุณากรอกข้อมูลอย่างน้อย 1 ช่อง');
    return;
  }

  lastSearchOrders = orders;           // ⭐ จำเงื่อนไขไว้
  await logStory('Search', orders);

  let q = supabaseClient.from('DemoDATA').select('*');
  if (orders.contractNumber) q = q.eq('contractNumber', orders.contractNumber);
  if (orders.houseNumber) q = q.ilike('houseNumber', `%${orders.houseNumber}%`);
  if (orders.circuitNumber) q = q.ilike('circuitNumber', `%${orders.circuitNumber}%`);

  const { data, error } = await q;
  if (error) return alert(error.message);

  renderTable(data || []);
}


function renderTable(data) {
  currentResults = data;
  $('tableBody').innerHTML = '';

  if (!data.length) {
    $('resultsSection').classList.add('hidden');
    $('noResults').classList.remove('hidden');
    return;
  }

  data.forEach((row, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="px-4 py-2">${idx+1}</td>` +
      FIELDS.map(f => `<td class="px-4 py-2">${row[f] ?? ''}</td>`).join('');
    $('tableBody').appendChild(tr);
  });

  $('resultCount').textContent = `พบทั้งหมด ${data.length} รายการ`;
  $('noResults').classList.add('hidden');
  $('resultsSection').classList.remove('hidden');
}

function clearSearch() {
  ['contractNumber','houseNumber','circuitNumber'].forEach(id => $(id).value='');
  $('resultsSection').classList.add('hidden');
  $('noResults').classList.add('hidden');
  currentResults = [];
}

async function downloadExcel() {
  if (!currentResults.length) return alert('ไม่มีข้อมูลสำหรับดาวน์โหลด');

  await logStory(
    'Download',
    lastSearchOrders ?? { note: 'download_without_search' }
  );

  const plain = currentResults.map(r => {
    const o = {};
    Object.keys(r).forEach(k => o[k] = r[k] ?? '');
    return o;
  });

  const ws = XLSX.utils.json_to_sheet(plain);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'DemoDATA');

  // ⭐ ดึงลำดับสัญญาจากเงื่อนไขค้นหา
  const contractNo = lastSearchOrders?.contractNumber || 'ALL';

  const fileName = `Contract_data_${contractNo} ${fileDateStr()}.xlsx`;

  XLSX.writeFile(wb, fileName);
}

['contractNumber','houseNumber','circuitNumber'].forEach(id => {
  $(id).addEventListener('keypress', e => e.key === 'Enter' && searchContract());
});
function logout() {
  localStorage.clear();
  window.location.href = "Index.html";
}

</script>

</body>
</html>
