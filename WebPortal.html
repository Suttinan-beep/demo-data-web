<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Web Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Kanit', 'Inter', sans-serif;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #e8f4fc 0%, #faf8f0 50%, #fef9e7 100%);
    }
    
    .card-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }
    
    .btn-transition {
      transition: all 0.25s ease;
    }
    
    .modal-overlay {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }
    
    .input-focus:focus {
      outline: none;
      border-color: #7ec8e3;
      box-shadow: 0 0 0 3px rgba(126, 200, 227, 0.2);
    }
    
    .link-item:hover {
      background: linear-gradient(90deg, #e8f4fc 0%, transparent 100%);
    }
    
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }
    
    .scrollbar-thin::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }
    
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #c5d8e8;
      border-radius: 3px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fadeIn {
      animation: fadeIn 0.3s ease forwards;
    }
    
    .animate-slideUp {
      animation: slideUp 0.4s ease forwards;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="h-full gradient-bg">

  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

        async function loadWebPortal() {
    const { data, error } = await supabaseClient
        .from('webportal')
        .select('*')
        .eq('status', 'active')
        .order('created_at', { ascending: false });
        console.log('DATA:', data); // 👈 เพิ่ม
        console.log('ERROR:', error); // 👈 เพิ่ม

        if (error) {
        console.error('INSERT ERROR:', error?.message, error);
        showToast('โหลดข้อมูลไม่สำเร็จ', 'error');
        return;
    }

      allData = data;
      renderDeptFilter(); // ✅ เพิ่มตรงนี้
      renderCards();
    }
    


    // Default configuration
    const defaultConfig = {
      portal_title: 'Enterprise Web Portal',
      search_placeholder: 'ค้นหาแผนก, หรือคีย์เวิร์ด...',
      background_color: '#e8f4fc',
      surface_color: '#ffffff',
      text_color: '#1f2937',
      primary_action_color: '#38bdf8',
      secondary_action_color: '#fbbf24'
    };

    let config = { ...defaultConfig };
    let allData = [];
    let searchQuery = '';
    let isSubmitting = false;
    let selectedDept = ''; // ✅ เพิ่มตรงนี้

    function renderDeptFilter() {
  const container = document.getElementById('dept-filter');

  const depts = [...new Set(allData.map(item => item.department || 'ไม่ระบุ'))];

  let html = `
    <div 
      class="cursor-pointer px-3 py-2 rounded-lg ${!selectedDept ? 'bg-sky-100 text-sky-600' : 'hover:bg-gray-100'}"
      onclick="selectDept('')"
    >
      ทั้งหมด
    </div>
  `;

  depts.forEach(dept => {
    html += `
      <div 
        class="cursor-pointer px-3 py-2 rounded-lg ${selectedDept === dept ? 'bg-sky-100 text-sky-600' : 'hover:bg-gray-100'}"
        onclick="selectDept('${dept}')"
      >
        ${dept}
      </div>
    `;

  container.innerHTML = html;
}

function selectDept(dept) {
  selectedDept = dept;
  renderDeptFilter();
  renderCards();
}
    

    function applyConfig() {
      const title = config.portal_title || defaultConfig.portal_title;
      const placeholder = config.search_placeholder || defaultConfig.search_placeholder;
      const bgColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;

      document.getElementById('portal-title').textContent = title;
      document.getElementById('search-input').placeholder = placeholder;

      // Apply colors
      document.body.style.background = `linear-gradient(135deg, ${bgColor} 0%, ${surfaceColor} 50%, #fef9e7 100%)`;
      
      document.querySelectorAll('.card-surface').forEach(el => {
        el.style.backgroundColor = surfaceColor;
      });

      document.querySelectorAll('.text-primary').forEach(el => {
        el.style.color = textColor;
      });

      document.querySelectorAll('.btn-primary').forEach(el => {
        el.style.background = `linear-gradient(to right, ${primaryColor}, ${adjustColor(primaryColor, -10)})`;
      });

      document.querySelectorAll('.btn-edit').forEach(el => {
        el.style.backgroundColor = secondaryColor;
      });
    }

    function adjustColor(color, percent) {
      const num = parseInt(color.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = (num >> 16) + amt;
      const G = (num >> 8 & 0x00FF) + amt;
      const B = (num & 0x0000FF) + amt;
      return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 + (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 + (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
    }

    // Data handler for Data SDK
    const dataHandler = {
      onDataChanged(data) {
        allData = data;
        renderCards();
      }
    };

    // Initialize Data SDK
    async function initDataSdk() {
      const result = await window.dataSdk.init(dataHandler);
      if (!result.isOk) {
        showToast('ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
      }
    }

    // Render cards grouped by department
    function renderCards() {
      const container = document.getElementById('cards-container');
      const emptyState = document.getElementById('empty-state');
      
      // Filter by search query
      const filteredData = allData.filter(item => {
  const query = searchQuery.toLowerCase();

  const matchSearch = !searchQuery || (
    item.department?.toLowerCase().includes(query) ||
    item.link_name?.toLowerCase().includes(query) ||
    item.description?.toLowerCase().includes(query)
  );

  const matchDept = !selectedDept || item.department === selectedDept;

  return matchSearch && matchDept;
});

      // Update stats
      document.getElementById('total-count').textContent = filteredData.length;
      const uniqueDepts = [...new Set(filteredData.map(item => item.department))];
      document.getElementById('dept-count').textContent = uniqueDepts.length;

      if (filteredData.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Group by department
      const grouped = filteredData.reduce((acc, item) => {
        const dept = item.department || 'ไม่ระบุแผนก';
        if (!acc[dept]) acc[dept] = [];
        acc[dept].push(item);
        return acc;
      }, {});

      // Build HTML
      let html = '';
      const deptColors = ['from-sky-400 to-blue-500', 'from-amber-400 to-orange-500', 'from-emerald-400 to-teal-500', 'from-purple-400 to-indigo-500', 'from-rose-400 to-pink-500'];
      let colorIndex = 0;

      for (const [dept, items] of Object.entries(grouped)) {
        const color = deptColors[colorIndex % deptColors.length];
        colorIndex++;

        html += `
          <div class="animate-slideUp" style="animation-delay: ${colorIndex * 0.1}s">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-1 h-8 rounded-full bg-gradient-to-b ${color}"></div>
              <h2 class="text-lg font-semibold text-gray-700">${dept}</h2>
              <span class="text-xs px-2 py-1 bg-gray-100 text-gray-500 rounded-full">${items.length} รายการ</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
              ${items.map(item => createCardHTML(item)).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
      attachCardEvents();
    }

    function createCardHTML(item) {
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
      
      return `
        <div class="w-[300px] bg-white rounded-xl card-shadow card-hover btn-transition p-5" data-id="${item.id}">
          <div class="flex items-start justify-between mb-3">
            <div class="flex-1 min-w-0">
              <p class="text-sm text-gray-400 mb-1">${item.department || ''}</p>
              <p class="font-semibold text-gray-800 text-primary truncate">${item.link_name || 'ไม่ระบุชื่อ'}</p>
            </div>
            <div class="flex items-center gap-1 ml-2">
              <button 
                class="edit-btn w-8 h-8 rounded-lg flex items-center justify-center btn-transition hover:scale-110 btn-edit"
                style="background-color: ${secondaryColor}20; color: ${secondaryColor}"
                data-id="${item.id}"
                title="แก้ไข"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
              </button>
              <button 
                    class="delete-btn w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center btn-transition hover:bg-red-100 hover:scale-110"
                    data-id="${item.id}"
                    title="ลบ"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </div>
          
          <a 
            href="${item.url || '#'}" 
            target="_blank" 
            rel="noopener noreferrer"
            class="link-item flex items-center gap-3 p-3 rounded-lg -mx-2 btn-transition group"
          >
            <div class="w-10 h-10 rounded-lg flex items-center justify-center btn-primary" style="background: linear-gradient(to right, ${primaryColor}, ${adjustColor(primaryColor, -10)})">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-medium text-gray-700 truncate group-hover:text-sky-600 btn-transition">${item.link_name || 'ไม่ระบุชื่อ'}</p>
              <p class="text-xs text-gray-400 truncate">${item.url || ''}</p>
            </div>
            <svg class="w-5 h-5 text-gray-300 group-hover:text-sky-400 btn-transition group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
          
          ${item.description ? `
            <p class="mt-3 text-sm text-gray-400 line-clamp-2">${item.description}</p>
          ` : ''}
        </div>
      `;
    }

    function attachCardEvents() {
      // Edit buttons
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const item = allData.find(d => d.id === id);
          if (item) openEditModal(item);
        });
      });

      // Delete buttons
      document.querySelectorAll('.delete-btn').forEach(btn => {
        console.log('BTN ID:', btn.dataset.id); // 👈 เพิ่มบรรทัดนี้
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          showDeleteConfirm(btn, id);
        });
      });
    }

    function showDeleteConfirm(btn, id) {
      // Change button to confirm state
      const originalContent = btn.innerHTML;
      btn.innerHTML = `<span class="text-xs font-medium">ลบ?</span>`;
      btn.classList.add('bg-red-500', 'text-white', 'px-3');
      btn.classList.remove('bg-red-50', 'text-red-400');

      const confirmHandler = async () => {
        await deleteItem(id);
        btn.removeEventListener('click', confirmHandler);
      };

      const cancelHandler = (e) => {
        if (!btn.contains(e.target)) {
          btn.innerHTML = originalContent;
          btn.classList.remove('bg-red-500', 'text-white', 'px-3');
          btn.classList.add('bg-red-50', 'text-red-400');
          btn.removeEventListener('click', confirmHandler);
          document.removeEventListener('click', cancelHandler);
        }
      };

      setTimeout(() => {
        btn.addEventListener('click', confirmHandler, { once: true });
        document.addEventListener('click', cancelHandler);
      }, 10);

      // Auto reset after 3 seconds
      setTimeout(() => {
        if (btn.innerHTML.includes('ลบ?')) {
          btn.innerHTML = originalContent;
          btn.classList.remove('bg-red-500', 'text-white', 'px-3');
          btn.classList.add('bg-red-50', 'text-red-400');
          document.removeEventListener('click', cancelHandler);
        }
      }, 3000);
    }

  };

  if (editId) {
    const { error } = await supabaseClient
      .from('webportal')
      .update({
        department: formData.department,
        link_name: formData.link_name,
        url: formData.url,
        description: formData.description,
        updated_by: getUserId(),
        updated_at: new Date().toISOString()
      })
      .eq('id', editId);

    if (error) {
      console.error(error);
      showToast('อัปเดตไม่สำเร็จ', 'error');
      resetSubmit();
      return;
    }

    await logStory('WebPortal-Update', {
      id: editId,
      department: formData.department,
      link_name: formData.link_name,
      url: formData.url
    });

    showToast('อัปเดตข้อมูลเรียบร้อยแล้ว', 'success');
  }

  /* =========================

  else {

  .from('webportal')
  .insert([{
    department: formData.department,
    link_name: formData.link_name,
    url: formData.url,
    description: formData.description,
    created_by: getUserId(),

  }])

    await logStory('WebPortal-Create', {

        department: data.department

  closeModal();
  loadWebPortal();

    submitBtn.disabled = false;

  }
